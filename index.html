<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL + Z Cemetery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background stars -->
    <div class="stars"></div>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <div class="logo-icon">☠</div>

            <div>
                <h1>CTRL + Z</h1>
                <p>DIGITAL CEMETERY</p>
                <span>Where forgotten files come to rest.</span>
            </div>
        </div>

        <div class="header-buttons">
            <button id="buryBtn">
                ⚰ BURY A NEW FILE
            </button>

            <button id="filesBtn">
                🪦 Buried files: <span id="fileCount">11</span>
            </button>
        </div>

    </header>


    <!-- Main Cemetery -->
    <main class="cemetery">

        <!-- Moon -->
        <div class="moon"></div>

        <!-- Ground -->
        <div class="ground"></div>

        <!-- Cemetery Building -->
        <div class="cemetery-building">

            <!-- Left Tower -->
            <div class="tower left-tower">
                <div class="tower-roof"></div>
                <div class="tower-body">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
                <div class="tower-base"></div>
            </div>

            <!-- Right Tower -->
            <div class="tower right-tower">
                <div class="tower-roof"></div>
                <div class="tower-body">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
                <div class="tower-base"></div>
            </div>

            <!-- Main entrance -->
            <div class="entrance">

                <div class="roof"></div>

                <!-- Fire / lights -->
                <div class="torch torch-left"></div>
                <div class="torch torch-right"></div>

                <!-- Gate -->
                <div class="gate">

                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>
                    <div class="gate-bar"></div>

                    <div class="gate-circle left-circle"></div>
                    <div class="gate-circle right-circle"></div>

                </div>

            </div>

        </div>


        <!-- Path -->
        <div class="path"></div>


        <!-- Welcome text -->
        <section class="welcome">

            <div class="small-moon">☾</div>

            <h2>CTRL + Z</h2>

            <h3>CEMETERY</h3>

            <p>
                The final resting place of forgotten files.
            </p>

            <span>
                Approach the gates...
            </span>

        </section>


        <!-- Interaction controls -->
        <div class="controls">

            <span>
                🖱 Drag to look
            </span>

            <span>
                🔍 Scroll to move
            </span>

            <span>
                🪦 Tap a tomb
            </span>

            <span>
                🌹 Leave a rose
            </span>

        </div>

    </main>


    <!-- Visitors -->
    <button class="visitors" id="visitorBtn">
        ♟ VISITORS
    </button>


    <!-- File Modal -->
    <div class="modal" id="fileModal">

        <div class="modal-content">

            <button class="close" id="closeModal">×</button>

            <h2>⚰ Bury a New File</h2>

            <p>
                Give a forgotten file its final resting place.
            </p>

            <input
                type="text"
                id="fileName"
                placeholder="Enter file name..."
            >

            <button id="confirmBury">
                🪦 Bury File
            </button>

        </div>

    </div>


    <!-- Buried files modal -->
    <div class="modal" id="filesModal">

        <div class="modal-content">

            <button class="close" id="closeFilesModal">×</button>

            <h2>🪦 Buried Files</h2>

            <div id="fileList"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
