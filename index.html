<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CTRL + Z Cemetery</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- 3D WORLD -->
    <div id="scene"></div>


    <!-- TOP LEFT BRAND -->

    <header>

        <div class="logo">

            <span class="logo-icon">⚰</span>

            <div>

                <div class="logo-main">
                    CTRL + Z
                </div>

                <div class="logo-sub">
                    DIGITAL CEMETERY
                </div>

            </div>

        </div>

        <p class="tagline">
            Where forgotten files come to rest.
        </p>

    </header>


    <!-- FILE SELECT -->

    <div class="file-area">

        <label
            for="fileInput"
            class="file-button"
        >
            ⚰ SELECT FILE TO BURY
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <div
            id="graveCount"
            class="grave-count"
        >
            🪦 Files buried: 0
        </div>

    </div>


    <!-- WELCOME TEXT -->

    <div
        id="welcome"
        class="welcome"
    >

        <div class="welcome-moon">
            ☾
        </div>

        <h1>
            CTRL + Z
        </h1>

        <h2>
            CEMETERY
        </h2>

        <p>
            Approach the gates...
        </p>

    </div>


    <!-- FILE DETAILS -->

    <div
        id="infoPanel"
        class="info-panel"
    >

        <button
            id="closeInfo"
            class="close-info"
        >
            ×
        </button>

        <div class="info-title">
            ⚰ FILE RECORD
        </div>

        <div id="fileDetails"></div>

    </div>


    <!-- VISITOR MEMORIAL BUTTON -->

    <button
        id="visitorButton"
        class="visitor-button"
    >
        🕯 Memorial
    </button>


    <!-- VISITOR PANEL -->

    <div
        id="visitorPanel"
        class="visitor-panel hidden"
    >

        <div class="visitor-title">

            <span>
                🕯 VISITOR MEMORIAL
            </span>

            <button
                id="closeVisitors"
                class="close-visitors"
            >
                ×
            </button>

        </div>


        <!-- ROSES -->

        <div class="rose-row">

            <button
                id="roseButton"
                class="rose-button"
            >
                🌹 Leave a Rose
            </button>

            <span id="roseCount">
                0 roses
            </span>

        </div>


        <!-- COMMENT -->

        <textarea
            id="commentInput"
            placeholder="Leave a message for the forgotten files..."
            maxlength="180"
        ></textarea>


        <button
            id="commentButton"
            class="comment-button"
        >
            Leave Comment
        </button>


        <div
            id="comments"
            class="comments"
        ></div>

    </div>


    <!-- BOTTOM INSTRUCTIONS -->

    <div class="instructions">

        <span>🖱 Drag to look</span>

        <span>🔍 Scroll to move</span>

        <span>🪦 Click a tomb</span>

        <span>🌹 Leave a rose</span>

    </div>


    <!-- THREE.JS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="script.js"></script>

</body>

</html>
