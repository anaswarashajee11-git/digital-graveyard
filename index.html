<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CTRL + Z Cemetery</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- =========================================
         3D WORLD
         ========================================= -->

    <div id="scene"></div>


    <!-- =========================================
         TOP HEADER
         ========================================= -->

    <header>

        <div class="brand">

            <div class="brand-icon">
                ⚰
            </div>

            <div>

                <div class="brand-title">
                    CTRL + Z
                </div>

                <div class="brand-subtitle">
                    DIGITAL CEMETERY
                </div>

            </div>

        </div>


        <div class="top-description">
            Where forgotten files come to rest.
        </div>

    </header>


    <!-- =========================================
         FILE UPLOAD
         ========================================= -->

    <div class="file-controls">

        <label
            for="fileInput"
            class="bury-button"
        >
            ⚰ SELECT FILE TO BURY
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <div
            id="graveCount"
            class="grave-count"
        >
            🪦 Files buried: 0
        </div>

    </div>


    <!-- =========================================
         WELCOME MESSAGE
         ========================================= -->

    <div
        id="welcome"
        class="welcome"
    >

        <div class="welcome-symbol">
            ☾
        </div>

        <h1>
            CTRL + Z
        </h1>

        <h2>
            CEMETERY
        </h2>

        <p>
            Approach the gates...
        </p>

        <span>
            The forgotten files are waiting.
        </span>

    </div>


    <!-- =========================================
         FILE DETAILS PANEL
         ========================================= -->

    <div
        id="infoPanel"
        class="info-panel"
    >

        <button
            id="closeInfo"
            class="close-button"
        >
            ×
        </button>

        <div class="panel-heading">
            ⚰ FILE RECORD
        </div>

        <div
            id="fileDetails"
        ></div>

    </div>


    <!-- =========================================
         VISITOR MEMORIAL
         ========================================= -->

    <div
        id="visitorPanel"
        class="visitor-panel"
    >

        <div class="visitor-header">

            <span>
                🕯 VISITOR MEMORIAL
            </span>

            <button
                id="toggleVisitors"
                class="mini-button"
            >
                ×
            </button>

        </div>


        <div class="rose-section">

            <button
                id="roseButton"
                class="rose-button"
            >
                🌹 Leave a Rose
            </button>

            <span id="roseCount">
                0 roses
            </span>

        </div>


        <div class="comment-section">

            <textarea
                id="commentInput"
                placeholder="Leave a message for the forgotten files..."
                maxlength="180"
            ></textarea>

            <button
                id="commentButton"
                class="comment-button"
            >
                Leave Comment
            </button>

        </div>


        <div
            id="comments"
            class="comments"
        ></div>

    </div>


    <!-- =========================================
         VISITOR BUTTON
         ========================================= -->

    <button
        id="visitorButton"
        class="visitor-button"
    >
        🕯 Memorial
    </button>


    <!-- =========================================
         INSTRUCTIONS
         ========================================= -->

    <div class="instructions">

        <span>
            🖱 Drag to look
        </span>

        <span>
            🔍 Scroll to move
        </span>

        <span>
            🪦 Click a tomb
        </span>

        <span>
            🌹 Leave a rose
        </span>

    </div>


    <!-- =========================================
         THREE.JS
         ========================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="script.js"></script>

</body>

</html>
