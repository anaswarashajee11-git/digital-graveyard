<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL + Z CEMETERY</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <div class="title">
            ⚰ CTRL + Z CEMETERY
        </div>

        <div class="subtitle">
            Where forgotten files come to rest...
        </div>

        <div class="stats">
            TOMBS:
            <span id="graveCount">0</span>
        </div>

        <label class="buryButton" for="fileInput">
            ⚰ BURY A FILE
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
        >
    </header>


    <!-- ================= 3D SCENE ================= -->

    <div id="scene"></div>


    <!-- ================= MEMORIAL PANEL ================= -->

    <div id="memorialPanel">

        <button id="closeMemorial">✕</button>

        <div id="memorialContent"></div>

        <button id="openVisitorPanel" class="visitorOpen">
            🌹 VISIT THIS TOMB
        </button>

    </div>


    <!-- ================= VISITOR PANEL ================= -->

    <div id="visitorPanel">

        <button id="closeVisitorPanel">✕</button>

        <h2>🌹 VISITOR MEMORIAL</h2>

        <h3 id="selectedTombName">
            Tomb
        </h3>

        <div class="roseSection">

            <button id="roseButton">
                🌹 Leave a Rose
            </button>

            <div class="roseCount">
                Roses:
                <span id="roseCount">0</span>
            </div>

        </div>


        <div class="commentSection">

            <textarea
                id="commentInput"
                placeholder="Leave a message for the forgotten..."
            ></textarea>

            <button id="commentButton">
                💬 Leave Comment
            </button>

        </div>


        <div id="comments">
        </div>

    </div>


    <!-- ================= INSTRUCTIONS ================= -->

    <div class="instructions">

        <span>🖱 Drag</span>
        <span>🔍 Scroll to explore</span>
        <span>⚰ Click a tomb</span>
        <span>🌙 Enter the cemetery</span>

    </div>


    <script src="script.js"></script>

</body>
</html>
