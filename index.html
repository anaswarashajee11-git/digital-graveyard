<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Graveyard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</head>

<body>

    <div id="header">

        <h1>⚰️ DIGITAL GRAVEYARD</h1>

        <p>Where forgotten files come to rest.</p>

        <label class="buryButton">
            📁 BURY A FILE
            <input type="file" id="fileInput">
        </label>

        <div id="counter">
            Files Buried: <span id="fileCount">0</span>
        </div>

    </div>

    <div id="scene"></div>

    <div id="infoPanel">

        <button id="closeButton">×</button>

        <div class="bigSkull">☠️</div>

        <h2 id="fileName">Unknown File</h2>

        <hr>

        <p>
            <span>Size</span>
            <strong id="fileSize">-</strong>
        </p>

        <p>
            <span>Born</span>
            <strong id="fileBorn">-</strong>
        </p>

        <p>
            <span>Died</span>
            <strong id="fileDied">-</strong>
        </p>

        <div class="causeBox">

            <h3>☠️ Cause of Death</h3>

            <p id="fileCause">-</p>

        </div>

    </div>

    <div id="instructions">

        🖱️ Drag to look around
        &nbsp; • &nbsp;
        🔍 Scroll to zoom
        &nbsp; • &nbsp;
        👆 Click a grave

    </div>

    <script src="script.js"></script>

</body>

</html>
