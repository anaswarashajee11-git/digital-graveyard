<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL + Z Cemetery</title>

    <link rel="stylesheet" href="style.css">

    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- ORBIT CONTROLS -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

    <!-- =========================
         TOP LEFT BRAND
    ========================== -->

    <div class="brand">

        <div class="brandIcon">
            ⚜
        </div>

        <div>
            <div class="brandTitle">
                CTRL + Z
            </div>

            <div class="brandSmall">
                DIGITAL CEMETERY
            </div>

            <div class="brandTagline">
                Where forgotten files come to rest.
            </div>
        </div>

    </div>


    <!-- =========================
         TOP RIGHT
    ========================== -->

    <div class="topRight">

        <label
            for="fileInput"
            class="buryButton"
        >
            ⚰ BURY A NEW FILE
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <div class="buriedCounter">

            🪦 Buried files:

            <span id="graveCount">
                0
            </span>

        </div>

    </div>


    <!-- =========================
         3D WORLD
    ========================== -->

    <div id="scene"></div>


    <!-- =========================
         MEMORIAL PANEL
    ========================== -->

    <div
        id="memorialPanel"
        class="memorialPanel"
    >

        <button
            id="closeMemorial"
            class="closeButton"
        >
            ×
        </button>

        <div id="memorialContent"></div>

        <button
            id="openVisitorPanel"
            class="visitorButton"
        >
            🌹 VISIT THIS TOMB
        </button>

    </div>


    <!-- =========================
         VISITOR PANEL
    ========================== -->

    <div
        id="visitorPanel"
        class="visitorPanel"
    >

        <button
            id="closeVisitorPanel"
            class="closeButton"
        >
            ×
        </button>

        <div class="visitorTitle">
            🌹 LEAVE A MEMORY
        </div>

        <div
            id="selectedTombName"
            class="selectedTomb"
        >
            Tomb
        </div>


        <button
            id="roseButton"
            class="roseButton"
        >
            🌹 Leave a Rose
        </button>

        <div class="roseCounter">

            Roses:

            <span id="roseCount">
                0
            </span>

        </div>


        <textarea
            id="commentInput"
            placeholder="Leave a message for the forgotten..."
        ></textarea>


        <button
            id="commentButton"
            class="commentButton"
        >
            💬 Leave Comment
        </button>


        <div
            id="comments"
            class="comments"
        ></div>

    </div>


    <!-- =========================
         VISITORS BUTTON
    ========================== -->

    <button
        id="visitorCountButton"
        class="visitorCountButton"
    >
        👻 VISITORS
    </button>


    <!-- =========================
         INTRO TEXT
    ========================== -->

    <div class="entranceText">

        <div class="smallMoon">
            ☾
        </div>

        <div class="mainTitle">
            CTRL + Z
        </div>

        <div class="cemeteryTitle">
            CEMETERY
        </div>

        <div class="description">
            The final resting place of forgotten files.
        </div>

        <div class="approach">
            Approach the gates...
        </div>

    </div>


    <!-- =========================
         BOTTOM CONTROLS
    ========================== -->

    <div class="controlsHelp">

        <span>
            🖱 Drag to look
        </span>

        <span>
            🔍 Scroll to move
        </span>

        <span>
            🪦 Tap a tomb
        </span>

        <span>
            🌹 Leave a rose
        </span>

    </div>


    <script src="script.js"></script>

</body>
</html>
